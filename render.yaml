services:
  - type: web
    name: coin-mine
    runtime: node
    plan: starter            # doimiy disk faqat pulli rejada mavjud
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: CHANNEL
        sync: false
      - key: ADMIN_ID
        sync: false
services:
  - type: web
    name: coin-mine
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: DATABASE_URL     # Neon (bepul Postgres) manzili
        sync: false
      - key: CHANNEL
        sync: false
      - key: ADMIN_ID
        sync: false
